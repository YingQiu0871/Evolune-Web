name: Deploy Evolune website

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          name: id_rsa
          known_hosts: unnecessary

      # The site is plain HTML/CSS with no build step: sync the repo as-is,
      # minus repository metadata and files that are not part of the site.
      - name: Sync to server
        run: |
          rsync -az --delete \
            --exclude='.git/' --exclude='.github/' --exclude='.gitignore' \
            --exclude='.nojekyll' --exclude='CNAME' --exclude='README.md' \
            --exclude='tests/' \
            -e "ssh -p $DEPLOY_PORT -o StrictHostKeyChecking=accept-new" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ vars.DEPLOY_PATH || '/var/www/evolune' }}/"
